{{define "login.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.L.T "login.title"}}</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <img class="login-logo" src="/static/logo.png" alt="M365 Backup">
    <p class="muted">{{.L.T "login.subtitle"}}</p>
    <label>{{.L.T "login.username"}}
      <input type="text" name="username" required autofocus autocomplete="username" spellcheck="false">
    </label>
    <label>{{.L.T "login.password"}}
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">{{.L.T "login.submit"}}</button>
    <div style="margin-top:1rem;display:flex;justify-content:center">{{template "langswitch" .}}</div>
  </form>
</body>
</html>
{{end}}
